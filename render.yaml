services:
  - type: web
    name: spassmonopoly-deluxe
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python game.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: LOG_LEVEL
        value: INFO
      - key: DB_ENGINE
        value: sqlite
      - key: DB_FILE
        value: spassmonopoly.db
      - key: GAME_ROOM_ID
        value: room_default
