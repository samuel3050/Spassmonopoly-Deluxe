<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spassmonopoly Deluxe - Lobby</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <style>
    .lobby-shell {
      width: min(100%, 680px);
    }

    .lobby-card {
      padding: clamp(20px, 4vw, 36px);
    }

    .lobby-header {
      display: grid;
      gap: 8px;
      justify-items: start;
      margin-bottom: 24px;
    }

    .lobby-header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
    }

    .lobby-actions,
    .join-form {
      display: flex;
      gap: 10px;
    }

    .lobby-actions {
      margin: 18px 0 24px;
    }

    .lobby-actions form,
    .lobby-actions button,
    .join-form input {
      flex: 1;
    }

    .lobby-section {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .players-list {
      display: grid;
      gap: 10px;
    }

    .player-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(23, 32, 45, 0.12);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.76);
      box-shadow: var(--shadow-soft);
    }

    .player-item.ready {
      border-color: rgba(73, 184, 115, 0.42);
      background: rgba(232, 249, 238, 0.92);
    }

    .player-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 900;
    }

    .player-status {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(223, 155, 41, 0.15);
      color: #7a4f08;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .player-status.ready {
      background: rgba(73, 184, 115, 0.16);
      color: #196b39;
    }

    .player-ready-btn {
      min-height: 36px;
      padding: 7px 10px;
      border: 1px solid rgba(23, 32, 45, 0.18);
      border-radius: var(--radius-md);
      background: #ffffff;
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }

    .player-ready-btn.ready {
      background: var(--good);
      color: #ffffff;
    }

    .status-message {
      padding: 11px 12px;
      border-radius: var(--radius-md);
      background: rgba(75, 143, 232, 0.12);
      color: #1d4f96;
      font-weight: 850;
    }

    .status-message.success {
      background: rgba(73, 184, 115, 0.14);
      color: #196b39;
    }

    .status-message.warning {
      background: rgba(216, 76, 76, 0.12);
      color: #8b2222;
    }

    .empty-state {
      padding: 16px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.6);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 620px) {
      .lobby-actions,
      .join-form {
        flex-direction: column;
      }

      .player-item {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .player-ready-btn {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body class="page page-lobby">
  <main class="lobby-shell">
    <section class="lobby-card">
      <div class="lobby-header">
        <div class="hero-badge">Warteraum</div>
        <h1>Spassmonopoly Deluxe</h1>
        <p class="panel-copy">Tritt bei, setze dich bereit und starte die Runde, sobald mindestens zwei Spieler bereit sind.</p>
      </div>

      <div class="lobby-actions">
        <form method="post" action="{{ url_for('lobby_continue') }}">
          <button type="submit" class="primary-btn full-width" {% if not has_saved_game %}disabled{% endif %}>
            Letzte Runde fortsetzen
          </button>
        </form>
        <form method="post" action="{{ url_for('lobby_new') }}">
          <button type="submit" class="secondary-btn full-width">Neue Runde</button>
        </form>
      </div>

      <div id="statusMessage"></div>

      <div class="lobby-section" id="joinSection">
        <h2>Dem Spiel beitreten</h2>
        <form class="join-form" onsubmit="joinGame(event)">
          <input type="text" id="playerName" placeholder="Dein Name" required maxlength="24" autocomplete="off">
          <button type="submit" class="primary-btn">Beitreten</button>
        </form>
      </div>

      <div class="lobby-section">
        <h2>Spieler online (<span id="playerCount">0</span>)</h2>
        <div id="playersList" class="players-list">
          <div class="empty-state">Noch keine Spieler verbunden.</div>
        </div>
      </div>

      <div class="lobby-actions">
        <button id="startBtn" class="primary-btn" onclick="startGame()" disabled>Spiel starten</button>
        <button id="refreshBtn" class="secondary-btn" onclick="updateLobby()">Aktualisieren</button>
      </div>
    </section>
  </main>

  <script>
    let currentPlayerId = {{ current_player_id|tojson }};
    let autoRefreshInterval = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showStatus(message, type = "info") {
      const msgEl = document.getElementById("statusMessage");
      const status = document.createElement("div");
      status.className = `status-message ${type}`;
      status.textContent = message;
      msgEl.replaceChildren(status);
      window.setTimeout(() => msgEl.replaceChildren(), 5000);
    }

    async function joinGame(event) {
      event.preventDefault();
      const input = document.getElementById("playerName");
      const name = input.value.trim();
      if (!name) {
        showStatus("Bitte gib deinen Namen ein.", "warning");
        return;
      }

      try {
        const response = await fetch("/lobby/join", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `name=${encodeURIComponent(name)}`,
        });
        const data = await response.json();
        if (!data.ok) {
          showStatus(data.msg || "Beitritt fehlgeschlagen.", "warning");
          return;
        }
        currentPlayerId = data.player_id;
        if (data.game_started) {
          window.location.href = data.redirect_url || "/board";
          return;
        }
        document.getElementById("joinSection").style.display = "none";
        showStatus(`Willkommen ${name}. Setze dich bereit, sobald du startklar bist.`, "success");
        await updateLobby();
        startAutoRefresh();
      } catch (error) {
        showStatus("Verbindungsfehler beim Beitreten.", "warning");
      }
    }

    async function updateLobby() {
      try {
        const response = await fetch("/lobby/state");
        const data = await response.json();
        if (!data.ok) throw new Error(data.msg || "Lobby konnte nicht geladen werden.");

        const playersList = document.getElementById("playersList");
        const playerCount = document.getElementById("playerCount");
        playerCount.textContent = data.players.length;

        if (data.game_started && currentPlayerId) {
          window.location.href = data.redirect_url || "/board";
          return;
        }

        if (!data.players.length) {
          playersList.innerHTML = '<div class="empty-state">Noch keine Spieler verbunden.</div>';
          document.getElementById("startBtn").disabled = true;
          return;
        }

        playersList.innerHTML = "";
        data.players.forEach((player) => {
          const isCurrentPlayer = currentPlayerId === player.id;
          const readyClass = player.ready ? "ready" : "";
          const item = document.createElement("div");
          item.className = `player-item ${readyClass}`;
          item.innerHTML = `
            <span class="player-name">${escapeHtml(player.name)}</span>
            <span class="player-status ${readyClass}">${player.ready ? "Bereit" : "Wartet"}</span>
            ${isCurrentPlayer ? `<button class="player-ready-btn ${readyClass}" onclick="toggleReady()">${player.ready ? "Bereit" : "Bereit setzen"}</button>` : ""}
          `;
          playersList.appendChild(item);
        });

        const startBtn = document.getElementById("startBtn");
        startBtn.disabled = data.game_started || !data.all_ready || data.players.length < 2;
        startBtn.textContent = data.game_started ? "Spiel laeuft" : "Spiel starten";
      } catch (error) {
        showStatus(error.message || "Lobby-Update fehlgeschlagen.", "warning");
      }
    }

    async function toggleReady() {
      if (!currentPlayerId) return;
      try {
        const response = await fetch("/lobby/ready", { method: "POST" });
        const data = await response.json();
        if (!data.ok) {
          showStatus(data.msg || "Status konnte nicht geaendert werden.", "warning");
          return;
        }
        await updateLobby();
      } catch (error) {
        showStatus("Bereit-Status konnte nicht geaendert werden.", "warning");
      }
    }

    async function startGame() {
      const startBtn = document.getElementById("startBtn");
      startBtn.disabled = true;
      startBtn.textContent = "Startet...";
      try {
        const response = await fetch("/lobby/start", { method: "POST" });
        const data = await response.json();
        if (!data.ok) {
          showStatus(data.msg || "Start fehlgeschlagen.", "warning");
          await updateLobby();
          return;
        }
        showStatus("Spiel wird geoeffnet.", "success");
        window.setTimeout(() => {
          window.location.href = data.redirect_url || "/board";
        }, 400);
      } catch (error) {
        showStatus("Verbindungsfehler beim Starten.", "warning");
        await updateLobby();
      }
    }

    function startAutoRefresh() {
      if (autoRefreshInterval) window.clearInterval(autoRefreshInterval);
      autoRefreshInterval = window.setInterval(updateLobby, 1000);
    }

    updateLobby();
    startAutoRefresh();
  </script>
</body>
</html>
